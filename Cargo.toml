[package]
name = "spatie-db-dumper"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Spatie <info@spatie.be>"]
description = "Dump MySQL, MariaDB, PostgreSQL, SQLite and MongoDB databases using native tools"
license = "MIT"
repository = "https://github.com/spatie/db-dumper-rust"
documentation = "https://docs.rs/spatie-db-dumper"
readme = "README.md"
keywords = ["database", "backup", "dump", "mysql", "postgresql"]
categories = ["database"]
include = ["/src/", "/tests/", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/PARITY.md", "/Cargo.lock"]

[dependencies]
percent-encoding = "2"
same-file = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
